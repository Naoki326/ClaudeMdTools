<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f9"/>
      <stop offset="1" stop-color="#e6eaf1"/>
    </linearGradient>
    <filter id="shadowTab" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#0f1420" flood-opacity="0.20"/>
    </filter>
    <filter id="shadowPhone" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#0f1420" flood-opacity="0.24"/>
    </filter>
    <clipPath id="tabScreen">
      <rect x="50" y="72" width="880" height="552" rx="14"/>
    </clipPath>
    <clipPath id="phoneScreen">
      <rect x="984" y="192" width="176" height="396" rx="10"/>
    </clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="740" fill="url(#bg)"/>

  <!-- 平板外框（横屏，屏比 1.6 与截图一致） -->
  <g filter="url(#shadowTab)">
    <rect x="30" y="52" width="920" height="592" rx="30" fill="#17191f" stroke="#2c303a" stroke-width="1.5"/>
  </g>
  <!-- 平板摄像头 -->
  <circle cx="490" cy="62" r="3.5" fill="#3a3e49"/>
  <!-- 平板内屏：知识库视图截图 -->
  <g clip-path="url(#tabScreen)">
    <image href="knowledge.png" x="50" y="72" width="880" height="552" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- 手机外框（竖屏，部分错落在平板右侧） -->
  <g filter="url(#shadowPhone)">
    <rect x="972" y="180" width="200" height="420" rx="26" fill="#17191f" stroke="#2c303a" stroke-width="1.5"/>
  </g>
  <!-- 手机打孔摄像头 -->
  <circle cx="1072" cy="198" r="3" fill="#3a3e49"/>
  <!-- 手机内屏：课程视图截图（居中裁切） -->
  <g clip-path="url(#phoneScreen)">
    <image href="courses.png" x="984" y="192" width="176" height="396" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- 底部说明 -->
  <text x="600" y="708" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#8a93a3">平板 / 手机 —— 同一局域网 · 同一个服务 · 实时刷新</text>
</svg>
